<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Briefing Room — Politics, Macro, Stocks & Crypto</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --border: #243044;
      --text: #eef2f7;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #061018;
      font-weight: 700;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      margin-bottom: 8px;
    }
    .title {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .title a {
      color: var(--text);
      text-decoration: none;
    }
    .title a:hover {
      text-decoration: underline;
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>THE BRIEFING ROOM</h1>
        <div class="sub">Real-time dispatches across Politics, Macro, Stocks &amp; Crypto</div>
      </div>
      <a class="btn" href="https://t.me/thebriefingroom99" target="_blank" rel="noopener">Join Telegram</a>
    </header>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="ALL">ALL</button>
      <button class="filter-btn" data-cat="POLITICS">POLITICS</button>
      <button class="filter-btn" data-cat="MACRO">MACRO</button>
      <button class="filter-btn" data-cat="STOCKS">STOCKS</button>
      <button class="filter-btn" data-cat="CRYPTO">CRYPTO</button>
    </div>

    <div id="feed">Loading latest dispatches...</div>
  </div>

  <script>
    let allItems = [];
    let activeCategory = "ALL";

    function render() {
      const container = document.getElementById("feed");
      const items = activeCategory === "ALL"
        ? allItems
        : allItems.filter(item => item.category === activeCategory);

      if (!items.length) {
        container.innerHTML = `<div class="card"><p class="meta">No dispatches in ${activeCategory} yet.</p></div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const dt = new Date(item.published_at).toLocaleString();
        return `
          <article class="card">
            <span class="badge">${item.category}</span>
            <h2 class="title"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2>
            <div class="meta">Source: ${item.source} • ${dt}</div>
          </article>
        `;
      }).join("");
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        render();
      });
    });

    fetch("./feed.json?t=" + Date.now())
      .then(r => r.ok ? r.json() : [])
      .then(data => {
        allItems = Array.isArray(data) ? data : [];
        render();
      })
      .catch(() => {
        document.getElementById("feed").innerHTML =
          `<div class="card"><p class="meta">Feed initializing — run the bot workflow once to publish dispatches.</p></div>`;
      });
  </script>
</body>
</html>
