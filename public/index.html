<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Briefing Room — Live Dispatches</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #121722;
      --panel-2: #182030;
      --text: #eef2f7;
      --muted: #9aa6b8;
      --border: #253044;
      --accent: #38bdf8;
      --accent-2: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: 0.04em;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #071018;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .tg-btn:hover {
      filter: brightness(1.08);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .filter-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--panel-2);
      color: var(--text);
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      height: 168px;
      object-fit: cover;
      background: var(--panel-2);
      display: block;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .tag {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.35;
    }

    .card-title a {
      color: var(--text);
      text-decoration: none;
    }

    .card-title a:hover {
      color: var(--accent);
    }

    .card-summary {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      flex: 1;
    }

    .empty {
      padding: 36px 20px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>THE BRIEFING ROOM</h1>
        <p id="status-line">Loading live dispatches…</p>
      </div>
      <a class="tg-btn" href="https://t.me/thebriefingroom99" target="_blank" rel="noopener noreferrer">
        Join Telegram (@thebriefingroom99)
      </a>
    </header>

    <nav class="filters" aria-label="Category filters">
      <button class="filter-btn active" data-category="ALL">ALL</button>
      <button class="filter-btn" data-category="POLITICS">POLITICS</button>
      <button class="filter-btn" data-category="MACRO">MACRO</button>
      <button class="filter-btn" data-category="STOCKS">STOCKS</button>
      <button class="filter-btn" data-category="CRYPTO">CRYPTO</button>
    </nav>

    <main id="feed-container" class="grid"></main>
  </div>

  <script>
    const FALLBACKS = {
      POLITICS: "politics.jpg",
      MACRO: "macro.jpg",
      STOCKS: "stocks.jpg",
      CRYPTO: "crypto.jpg"
    };

    let allItems = [];
    let activeCategory = "ALL";

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fallbackFor(category) {
      const key = String(category || "MACRO").toUpperCase();
      return FALLBACKS[key] || "macro.jpg";
    }

    function formatTime(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderFeed() {
      const container = document.getElementById("feed-container");
      const filtered = activeCategory === "ALL"
        ? allItems
        : allItems.filter((item) => String(item.category || "").toUpperCase() === activeCategory);

      if (!filtered.length) {
        container.className = "";
        container.innerHTML = `<div class="empty">No dispatches in ${escapeHtml(activeCategory)} yet.</div>`;
        return;
      }

      container.className = "grid";
      container.innerHTML = filtered.map((item) => {
        const cat = String(item.category || "MACRO").toUpperCase();
        const fallback = fallbackFor(cat);
        const imgSrc = item.image || fallback;
        const timeLabel = formatTime(item.published_at);

        return `
          <article class="card">
            <img
              class="card-img"
              src="${escapeHtml(imgSrc)}"
              alt="${escapeHtml(item.title || "Dispatch image")}"
              loading="lazy"
              onerror="if (!this.dataset.fb) { this.dataset.fb = '1'; this.src = '${fallback}'; } else { this.style.display = 'none'; }"
            />
            <div class="card-body">
              <div class="meta">
                <span class="tag">${escapeHtml(cat)}</span>
                <span>${escapeHtml(item.source || "")}${timeLabel ? " · " + escapeHtml(timeLabel) : ""}</span>
              </div>
              <h2 class="card-title">
                <a href="${escapeHtml(item.link || "#")}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(item.title || "Untitled Dispatch")}
                </a>
              </h2>
              ${item.summary ? `<p class="card-summary">${escapeHtml(item.summary)}</p>` : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadFeed() {
      const statusEl = document.getElementById("status-line");
      try {
        const res = await fetch(`feed.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (Array.isArray(data)) {
          allItems = data;
        } else {
          allItems = Array.isArray(data.items) ? data.items : [];
          if (data.updated_at) {
            statusEl.textContent = `Updated ${formatTime(data.updated_at)} · ${allItems.length} dispatches`;
          }
        }

        if (!statusEl.textContent || statusEl.textContent === "Loading live dispatches…") {
          statusEl.textContent = `${allItems.length} live dispatches`;
        }
        renderFeed();
      } catch (err) {
        statusEl.textContent = "Unable to load feed.json yet";
        const container = document.getElementById("feed-container");
        container.className = "";
        container.innerHTML = `<div class="empty">Waiting for feed data (${escapeHtml(err.message)}).</div>`;
      }
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.category;
        renderFeed();
      });
    });

    loadFeed();
  </script>
</body>
</html>
