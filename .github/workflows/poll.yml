name: Briefing Room Poller

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: briefing-room-poller-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install feedparser requests

      - name: Run Briefing Room bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL_HANDLE: "@thebriefingroom99"
        run: python bot.py

      - name: Commit and push feed and state
        run: |
          set -e
          git config user.name "briefing-bot"
          git config user.email "41898282+briefing-bot@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update feed and seen items"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed cleanly on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt; syncing with origin/main..."
            git fetch origin main

            # Save the bot's newly generated outputs before resetting onto origin/main
            mkdir -p /tmp/bot_out
            [ -f seen_items.db ] && cp seen_items.db /tmp/bot_out/seen_items.db
            [ -f public/feed.json ] && cp public/feed.json /tmp/bot_out/feed.json

            git reset --hard origin/main

            [ -f /tmp/bot_out/seen_items.db ] && cp /tmp/bot_out/seen_items.db seen_items.db
            [ -f /tmp/bot_out/feed.json ] && mkdir -p public && cp /tmp/bot_out/feed.json public/feed.json

            git add -A
            if git diff --staged --quiet; then
              echo "Remote already matches our state."
              exit 0
            fi

            git commit -m "chore: update feed and seen items"
            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1
          
