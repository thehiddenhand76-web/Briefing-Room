name: Briefing Room Poller

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: briefing-room-poller-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install feedparser requests

      - name: Run Briefing Room bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL_HANDLE: "@thebriefingroom99"
        run: python bot.py

      - name: Commit updated state and feed
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+briefing-bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update feed and seen items"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi
          
